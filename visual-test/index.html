<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Square UI — Visual Regression Screenshots</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
    h1 { text-align: center; font-size: 28px; margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(600px, 1fr)); gap: 24px; max-width: 1400px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
    .card-header { padding: 12px 16px; background: #1a2332; display: flex; justify-content: space-between; align-items: center; }
    .card-header h3 { font-size: 16px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
    .badge-desktop { background: #3b82f6; color: white; }
    .badge-mobile { background: #8b5cf6; color: white; }
    .card img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <h1>📸 Square UI — Visual Screenshots</h1>
  <div class="grid" id="gallery"></div>
  <script>
    const images = [
      { file: 'square-ui.spec.ts-desktop-square-ui-landing.png', app: 'Square UI (Host)', device: 'desktop' },
      { file: 'square-ui.spec.ts-mobile-square-ui-landing.png', app: 'Square UI (Host)', device: 'mobile' },
      { file: 'access-hub-ui.spec.ts-mobile-access-hub-ui-landing.png', app: 'Access Hub', device: 'mobile' },
      { file: 'my-family-ui.spec.ts-mobile-my-family-ui-landing.png', app: 'My Family', device: 'mobile' },
      { file: 'notification-ui.spec.ts-desktop-notification-ui-landing.png', app: 'Notification', device: 'desktop' },
      { file: 'notification-ui.spec.ts-mobile-notification-ui-landing.png', app: 'Notification', device: 'mobile' },
      { file: 'payment-hub-ui.spec.ts-desktop-payment-hub-ui-landing.png', app: 'Payment Hub', device: 'desktop' },
      { file: 'payment-hub-ui.spec.ts-mobile-payment-hub-ui-landing.png', app: 'Payment Hub', device: 'mobile' },
      { file: 'uploader-ui.spec.ts-desktop-uploader-ui-landing.png', app: 'Uploader', device: 'desktop' },
      { file: 'uploader-ui.spec.ts-mobile-uploader-ui-landing.png', app: 'Uploader', device: 'mobile' },
      { file: 'daily-blog-ui.spec.ts-mobile-daily-blog-ui-landing.png', app: 'Daily Blog', device: 'mobile' },
      { file: 'ai-assistant-ui.spec.ts-mobile-ai-assistant-ui-landing.png', app: 'AI Assistant', device: 'mobile' },
      { file: 'dev-center-ui.spec.ts-mobile-dev-center-ui-landing.png', app: 'Dev Center', device: 'mobile' },
    ];
    const gallery = document.getElementById('gallery');
    images.forEach(img => {
      gallery.innerHTML += `
        <div class="card">
          <div class="card-header">
            <h3>${img.app}</h3>
            <span class="badge badge-${img.device}">${img.device} ${img.device === 'desktop' ? '1440×900' : '375×812'}</span>
          </div>
          <img src="${img.file}" alt="${img.app} ${img.device}" loading="lazy" />
        </div>`;
    });
  </script>
</body>
</html>
